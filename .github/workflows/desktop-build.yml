# Packages the desktop app (MX4, #305) — an unsigned macOS DMG and an unsigned
# Windows NSIS installer — and attaches them to the release the `v*` tag made.
#
# Why this is its own workflow rather than two more jobs in release.yml: that
# file publishes the server image and does it on ubuntu with Docker, from a
# single job whose whole content is buildx. These legs are macOS and Windows,
# take ten times as long, and compile native modules. Keeping them apart means
# a broken runner image on one platform cannot delay or muddy the image push
# that self-hosters actually pull, the two can be re-run independently, and this
# one can carry a `workflow_dispatch` for proving the pipeline from a branch —
# which release.yml must never have, since a manual run of *that* would publish
# an image. Both react to the same `v*.*.*` tag, so the release train stays one
# train: `gh release create vX.Y.Z` starts both, and both upload to that release.
name: Desktop build

on:
  push:
    tags: ["v*.*.*"]
  # The PR path (#562). Until this existed, everything below the workspace's
  # unit tests — the server-runtime pipeline, electron-builder, and the
  # packaged smoke test that boots the real bouncer — ran for the first time
  # *after* a release tag was pushed, which is the worst moment to learn that
  # the bundle no longer boots. The `paths` filter is what keeps that off every
  # other PR: nothing here runs unless the shell, the session library they
  # share, or this file changed.
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/session-engine/**"
      - ".github/workflows/desktop-build.yml"
  # Proving the pipeline without a release. In this mode nothing is published:
  # the installers land as workflow artifacts and the version is a dev one.
  # (GitHub only registers a workflow_dispatch once the file is on the default
  # branch — the runs that proved this workflow before it got there were
  # push-triggered from a temporary branch entry above, removed again.)
  workflow_dispatch:

jobs:
  package:
    name: package-${{ matrix.os }}
    # Tags and dispatches build installers; a PR gets the cheaper leg below.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      # Tag runs upload to the GitHub release; dispatch runs never touch it.
      contents: write
    strategy:
      # One platform's failure should not cancel the other's evidence.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. The runner's own architecture is load-bearing: the
          # server runtime's argon2 and re2 are compiled here, so this leg can
          # only produce the arch it runs on. An x64/universal DMG means adding
          # an x64 macOS runner to this list, not a flag.
          - os: macos
            runner: macos-latest
            builder-args: --mac dmg
            extension: dmg
          - os: windows
            runner: windows-latest
            builder-args: --win nsis
            extension: exe
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # The version the packaged app reports — `app.getVersion()`, and through
      # it the embedded server's CLIENT_VERSION and F-Chat's `cversion`. The tag
      # without its leading v, exactly as release.yml derives the image's; a
      # dispatch run gets a dev version that is obviously not a release. It is
      # injected at package time because package.json versions stay 0.0.0
      # across the workspace (house policy) — nothing in the tree is rewritten.
      - id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile

      # The whole build graph, unfiltered — the packaging step needs the web
      # dist, the server dist and the shell's own `dist`, which between them is
      # nearly all of it. Nothing in apps/web or apps/server is modified here;
      # this is the same `pnpm build` ci.yml runs.
      - run: pnpm build

      # The embedded server as a deployed, Electron-ABI tree — built HERE, on
      # this runner, because argon2 and re2 are native and an artifact built on
      # one OS is not a binary that runs on the other. (pglite is WASM and would
      # have travelled; the other two are the reason this is a matrix.)
      - run: pnpm --filter @emberchat/desktop server-runtime

      # Invariant 1, asserted from outside the script that maintains it: the
      # Electron rebuild above must not have reached the workspace's own native
      # modules, and the proof is that they still load under plain Node. The
      # build script fingerprints them internally; this is the cheap second
      # witness, and it is the one that would catch a Windows link kind the
      # seal walk does not recognise as a way out of the tree.
      - name: Workspace natives still load under Node (invariant 1)
        shell: bash
        run: >-
          pnpm --filter @emberchat/server exec node --input-type=commonjs
          -e "require('argon2'); require('re2'); console.log('workspace argon2 + re2 are still Node-ABI')"

      # The shell's unit tests on this OS — paths.ts resolves both layouts with
      # `path.join`, and Windows is the only place a separator assumption could
      # hide.
      - run: pnpm --filter @emberchat/desktop test

      - name: Package
        shell: bash
        run: >-
          pnpm --filter @emberchat/desktop exec electron-builder
          ${{ matrix.builder-args }}
          --publish never
          -c.extraMetadata.version=${{ steps.version.outputs.value }}
        env:
          # Unsigned by decision (electron-builder.yml `mac.identity: null`).
          # This stops the runner's keychain from being searched at all, so a
          # future signed leg is an explicit change rather than a surprise.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # The one test only a packaged build can fail: the real installer, taken
      # apart the way a user takes it apart, launched against an isolated
      # user-data directory with the sanctioned lifecycle probe (MX3 §6). It
      # boots the bouncer out of `resources/server-runtime`, provisions an
      # account, serves `resources/web`, closes to the tray and quits — and the
      # asserted version is the proof that the injection above arrived.
      - name: Packaged smoke test
        run: >-
          pnpm --filter @emberchat/desktop exec node scripts/smoke-packaged.mjs
          --version ${{ steps.version.outputs.value }}

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ steps.version.outputs.value }}
          path: apps/desktop/release/*.${{ matrix.extension }}
          retention-days: 14
          if-no-files-found: error

      # Release mode only. `--clobber` so a re-run after a fixed runner replaces
      # its own artifact instead of failing; the release itself is created by
      # hand (`gh release create vX.Y.Z`, house process) and is never made here.
      - name: Attach to the release
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag push and the release creation are the same `gh` command, so
          # the release is normally already there; a short wait covers the
          # ordering rather than assuming it.
          for i in $(seq 1 10); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" \
                apps/desktop/release/*.${{ matrix.extension }} --clobber
              exit 0
            fi
            sleep 15
          done
          echo "::error::no GitHub release for $GITHUB_REF_NAME to attach the installer to"
          exit 1

  # SHA-256 checksums for the installers the tag's release carries (#550) —
  # one `checksums.txt`, computed from the assets actually attached, after
  # both platform legs have attached them. docs/desktop.md's FAQ tells users
  # to download only from the releases page; while the builds are unsigned,
  # this file is what gives that instruction teeth. Computed by download
  # rather than passed between jobs so the hashes describe what a user gets,
  # not what a runner had. If a single platform leg is re-run (`--clobber`
  # replaces its installer), re-run this job too so the file matches.
  checksums:
    name: checksums
    if: ${{ github.ref_type == 'tag' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Compute and attach checksums.txt
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.exe'
          sha256sum -- * > checksums.txt
          cat checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber \
            --repo "$GITHUB_REPOSITORY"

  # The PR leg (#562): the same pipeline as above, minus everything a PR does
  # not need an answer about.
  #
  # ONE PLATFORM, AND IT IS macOS. Not thrift — honesty. The two shipped
  # targets are macOS and Windows (mx4-packaging.md: no Linux targets, by
  # decision), so an ubuntu leg would be packaging a platform nobody ships, on
  # a runner where the tray needs libappindicator and `safeStorage` needs a
  # keyring the runner does not have — a green that means nothing and a red
  # that means the runner. macOS is a real target, its runners are free for
  # public repositories, and it is the `utilityProcess` branch of the child
  # split (embedded-server.ts), which is the one every other platform uses.
  # Windows stays on the tag leg: it is the slower runner and the NSIS install
  # is the slower smoke, and this job exists to catch the pipeline breaking,
  # not to replace the release build.
  #
  # NO INSTALLER, EITHER. `--dir` stops at electron-builder's staging tree and
  # `--unpacked` points the smoke test at it: the same bundle, the same boot,
  # without spending a minute making a DMG nobody will mount. What the DMG and
  # the NSIS script themselves do is still the tag leg's question.
  pr-smoke:
    name: desktop-package-smoke
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # A version that could not be mistaken for a release, injected the same
      # way the release leg injects the real one — which is what makes the
      # smoke test's version assertion below a test of the injection.
      - id: version
        run: echo "value=0.0.0-pr.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @emberchat/desktop server-runtime

      # Invariant 1, as on the tag leg: the Electron rebuild must not have
      # reached the workspace's own native modules, and the proof is that they
      # still load under plain Node.
      - name: Workspace natives still load under Node (invariant 1)
        run: >-
          pnpm --filter @emberchat/server exec node --input-type=commonjs
          -e "require('argon2'); require('re2'); console.log('workspace argon2 + re2 are still Node-ABI')"

      - name: Package (staging tree only)
        run: >-
          pnpm --filter @emberchat/desktop exec electron-builder
          --mac dir
          --publish never
          -c.extraMetadata.version=${{ steps.version.outputs.value }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # The whole point of the leg: boot the bundle out of its own
      # `resources/`, provision an account against pglite, close to the tray
      # and quit — headless, through the sanctioned lifecycle probe (MX3 §6),
      # with no GUI automation anywhere near it.
      - name: Packaged smoke test
        run: >-
          pnpm --filter @emberchat/desktop exec node scripts/smoke-packaged.mjs
          --unpacked --version ${{ steps.version.outputs.value }}
