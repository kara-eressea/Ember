<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately WITHOUT `interactive-widget=resizes-content` (MP2 §2,
         #376). That directive tells Chromium to shrink the layout viewport when
         the soft keyboard opens, which would indeed lift the composer clear of
         it — measured here, and it works. It is still the wrong choice:
         it is Chromium-only (iOS Safari and Firefox ignore it), so
         lib/visual-viewport.ts has to exist for the other two engines
         regardless, and adding the directive would mean the engine most of our
         phone testing runs on is the one engine that never exercises that
         module. One measured path beats two, one of them untested. The module's
         arithmetic is self-cancelling by construction — an engine that resizes
         the layout viewport itself reports layout height == visual height and
         gets an inset of 0 — so Firefox Android already lands on the
         `resizes-content` behaviour without a directive, and Chromium would too
         if this were ever added.

         `viewport-fit=cover` (MP3 §3, #377) lets the document paint under the
         status bar and the home indicator, which is the only way an installed
         app looks installed — and, more to the point, the only way
         `env(safe-area-inset-*)` reports anything but 0. base.css turns those
         insets back into padding, gated on display-mode so a browser tab is
         unaffected either way. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Never hand a third-party host the URL of the instance a reader is on
         (audit backlog). Individual <img> tags already carry
         referrerPolicy="no-referrer", but <video> has no such attribute, so
         the preview player leaked a Referer; the document policy covers it and
         every other subresource app-wide. Verified against the default
         imagePreviewHosts — none of them hotlink-gate on Referer. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Install surface (MP3 §1–§2, #377). The manifest is served by Fastify,
         not shipped from public/, because it carries the configured product
         name (plugins/web-manifest.ts).

         What iOS actually honours, checked rather than cargo-culted: since
         15.4 Safari reads `display: standalone` out of the manifest, and the
         old `apple-mobile-web-app-capable` / `-status-bar-style` pair is
         documented as deprecated — it is now only a FALLBACK for when the
         manifest cannot be loaded, and that fallback ignores `start_url` and
         `scope`, so shipping it can make the installed app worse rather than
         better. Neither is here. `apple-touch-icon` is not in that group: it
         is still the icon iOS prefers for the home screen, so it stays, at the
         180px Apple documents. Splash screens remain proprietary
         (`apple-touch-startup-image`, one image per device size) and are out
         of MP3's scope. None of this is verifiable without a device —
         design/mp3-pwa.md §8 carries the install pass. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The installed title bar / Android status bar colour. This literal is
         the DEFAULT theme's `head` token, duplicated here because the document
         has to be coloured before any script runs; theme/theme.ts rewrites it
         from the active theme at boot and on every switch, and
         theme-color.test.ts fails if the two ever disagree. -->
    <meta name="theme-color" content="#201e1c" />
    <!-- The pre-paint ground (#533). Same literal-and-guard arrangement as the
         theme-color above, for the same reason and one floor lower: this is the
         DEFAULT theme's `bg` token, and it is the value of --eb-bg between the
         first paint and applyTheme()'s first write.

         It has to be a seeded *custom property* rather than a background
         declaration. base.css paints `html, body { background: var(--eb-bg) }`,
         and with --eb-bg undefined that declaration is invalid at computed-value
         time — which does not fall through to a rule underneath it, it wins the
         cascade and computes to `unset`. So a literal `background` here would be
         overwritten by the very sheet it is covering for; a literal --eb-bg
         makes base.css's own rule resolve instead, and applyTheme's inline
         property on the same element takes over the moment it runs.

         Why the window matters at all: an installed iOS window fills the strips
         behind the status bar and the home indicator from the document's
         background colour, sampled at load. A document that is transparent at
         that moment gets black bands for the life of the launch. -->
    <style>
      :root {
        --eb-bg: #1b1917;
      }
    </style>
    <!-- The product name, final since 2026-08-06 (#556). A literal here and a
         constant in the bundle, the same arrangement as the theme-color above
         and for the same reason: the document is titled before any script
         runs, and a title written from JavaScript is a tab that says something
         else first. shipping-shape.test.ts fails if this and APP_NAME
         (@emberchat/protocol) ever disagree. -->
    <title>EmberChat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
